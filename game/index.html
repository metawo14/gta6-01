<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORT MERIDIAN — a dusk city crime story</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0d14'/%3E%3Cpath d='M2 13L8 3l6 10z' fill='%23ffb545'/%3E%3C/svg%3E">
<style>
  :root {
    --amber: #ffb545;
    --amber-soft: #ffd79a;
    --teal: #38f0dc;
    --ink: #0a0d14;
    --panel: rgba(9, 13, 21, 0.74);
    --panel-edge: rgba(140, 200, 230, 0.22);
    --red: #ff4a3d;
    --font: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #070a11;
    color: #eaf2ff;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    background: #070a11;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(3px);
  }

  #hud-left {
    top: 22px;
    left: 24px;
    padding: 12px 16px 11px;
    min-width: 254px;
  }
  #health-row { display: flex; align-items: center; gap: 10px; }
  .label {
    font-size: 9px;
    letter-spacing: 2.1px;
    text-transform: uppercase;
    color: rgba(200, 224, 245, 0.62);
  }
  #health-bar {
    position: relative;
    flex: 1;
    height: 9px;
    background: rgba(255, 255, 255, 0.09);
    border-radius: 2px;
    overflow: hidden;
  }
  #health-fill {
    position: absolute;
    inset: 0;
    width: 100%;
    transform-origin: left center;
    background: linear-gradient(90deg, #47e6a0, #7cf7c2);
    transition: width 120ms linear, background 220ms linear;
  }
  #health-fill.amber { background: linear-gradient(90deg, #ffb545, #ffd07a); }
  #health-fill.red { background: linear-gradient(90deg, #ff3b30, #ff7a63); }
  #health-num {
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 34px;
    text-align: right;
    color: #eaf6ff;
  }
  #cash-row {
    margin-top: 9px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  #cash { font-size: 21px; font-weight: 700; color: #93f2b4; letter-spacing: 0.4px; font-variant-numeric: tabular-nums; }
  #cash.spend { color: #ff9a8a; }
  #stars { margin-top: 8px; display: flex; gap: 4px; font-size: 19px; line-height: 1; color: rgba(255, 255, 255, 0.14); }
  #stars .star { transition: color 150ms linear, text-shadow 150ms linear; }
  #stars .star.lit { color: var(--amber); text-shadow: 0 0 10px rgba(255, 181, 69, 0.7); }
  #stars .star.hot { color: #fff2d2; text-shadow: 0 0 16px rgba(255, 220, 150, 0.95); animation: pulse 900ms ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }

  #hud-right { top: 22px; right: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #clock {
    padding: 10px 16px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  #clock-time { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  #clock-phase { font-size: 9px; letter-spacing: 2.2px; color: var(--amber-soft); }
  #weapon {
    padding: 9px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #weapon-name { font-size: 11px; letter-spacing: 2px; color: #cfe6ff; }
  #weapon-ammo { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--amber-soft); }
  #weapon-ammo.low { color: #ff8a70; }

  #objective {
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 26px 12px;
    text-align: center;
    min-width: 340px;
    max-width: 560px;
    border-top: 2px solid rgba(255, 181, 69, 0.75);
  }
  #obj-job { font-size: 9px; letter-spacing: 2.6px; color: var(--amber); }
  #obj-name { font-size: 13px; letter-spacing: 1.4px; margin-top: 3px; color: #eaf6ff; text-transform: uppercase; }
  #obj-step { font-size: 14px; margin-top: 5px; color: #cfe3f7; }

  #minimap-wrap {
    position: absolute;
    right: 24px;
    bottom: 24px;
    width: 230px;
    height: 230px;
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
    background: #070a11;
  }
  #minimap { display: block; width: 230px; height: 230px; }
  #minimap-n {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #dcecff;
    text-shadow: 0 0 6px #000;
  }

  #speedo {
    left: 24px;
    bottom: 24px;
    padding: 11px 18px;
    display: none;
    align-items: baseline;
    gap: 8px;
  }
  #speedo.show { display: flex; }
  #speedo-num { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; min-width: 74px; text-align: right; }
  #speedo-unit { font-size: 10px; letter-spacing: 2px; color: rgba(200, 224, 245, 0.6); }
  #gear {
    margin-left: 8px;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 181, 69, 0.5);
    color: var(--amber);
    font-weight: 700;
    font-size: 14px;
    border-radius: 2px;
  }

  #prompt {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    padding: 8px 18px;
    font-size: 13px;
    letter-spacing: 0.7px;
    color: #e6f2ff;
    background: rgba(9, 13, 21, 0.68);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    opacity: 0;
    transition: opacity 160ms linear;
    white-space: nowrap;
  }
  #prompt.show { opacity: 1; }

  #banner {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%) scale(0.96);
    text-align: center;
    opacity: 0;
    transition: opacity 300ms ease, transform 300ms ease;
  }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner-title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #fff3d8;
    text-shadow: 0 0 28px rgba(255, 181, 69, 0.85), 0 4px 18px rgba(0, 0, 0, 0.8);
  }
  #banner-sub {
    margin-top: 8px;
    font-size: 17px;
    letter-spacing: 2.4px;
    color: var(--amber);
  }

  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(180, 10, 10, 0) 42%, rgba(190, 12, 12, 0.72) 100%);
    transition: opacity 260ms linear;
  }
  #vignette.hit { opacity: 1; }
  #vignette.low { opacity: 0.5; animation: vitPulse 1200ms ease-in-out infinite; }
  @keyframes vitPulse { 0%, 100% { opacity: 0.32; } 50% { opacity: 0.82; } }

  /* ---------- overlays ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 22% 18%, rgba(30, 60, 110, 0.55), transparent 62%),
      radial-gradient(ellipse at 82% 88%, rgba(190, 70, 40, 0.34), transparent 66%),
      rgba(4, 6, 12, 0.9);
    backdrop-filter: blur(2px);
  }
  #overlay.show { display: flex; }
  .card {
    width: min(760px, 92vw);
    max-height: 92vh;
    overflow: auto;
    padding: 38px 44px 34px;
    background: linear-gradient(180deg, rgba(14, 20, 32, 0.96), rgba(8, 11, 18, 0.97));
    border: 1px solid rgba(140, 200, 230, 0.2);
    border-top: 3px solid var(--amber);
    border-radius: 4px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75);
  }
  .kicker { font-size: 10px; letter-spacing: 4px; color: var(--amber); }
  h1 {
    margin: 6px 0 2px;
    font-size: 54px;
    line-height: 0.96;
    letter-spacing: 3px;
    font-weight: 800;
    background: linear-gradient(180deg, #fff6e2 20%, #ffb545 96%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 150, 60, 0.22);
  }
  .sub { font-size: 11px; letter-spacing: 3.6px; color: #7fd8e6; margin-top: 4px; }
  .story { margin: 20px 0 0; font-size: 14px; line-height: 1.66; color: #c3d4e8; max-width: 60ch; }
  .story b { color: #ffd79a; font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 22px; }
  .cols h2 { font-size: 10px; letter-spacing: 2.6px; color: var(--amber); margin: 0 0 8px; text-transform: uppercase; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12px; color: #b8cade; }
  .keys kbd {
    font-family: var(--font);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: #eaf6ff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 2px 6px;
    white-space: nowrap;
    text-align: center;
  }
  .save { margin-top: 20px; font-size: 11px; letter-spacing: 1.2px; color: #8fa6bd; }
  .save b { color: #93f2b4; }
  .buttons { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  button.act {
    pointer-events: auto;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.6px;
    padding: 13px 30px;
    color: #0a0d14;
    background: linear-gradient(180deg, #ffd79a, #ffb545);
    border: 0;
    border-radius: 3px;
    cursor: pointer;
    transition: transform 90ms ease, box-shadow 160ms ease, filter 160ms ease;
    box-shadow: 0 6px 24px rgba(255, 160, 60, 0.28);
  }
  button.act:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.act:active { transform: translateY(1px); }
  button.act.ghost {
    color: #d8ebff;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(160, 210, 235, 0.3);
    box-shadow: none;
  }
  .hidden { display: none !important; }
  .end-title { font-size: 44px; letter-spacing: 4px; font-weight: 800; margin: 8px 0 6px; }
  .end-busted .end-title { color: #ff5a48; text-shadow: 0 0 34px rgba(255, 60, 48, 0.5); }
  .end-wasted .end-title { color: #c8a6ff; text-shadow: 0 0 34px rgba(170, 130, 255, 0.45); }
  @media (max-width: 860px) {
    h1 { font-size: 38px; }
    .cols { grid-template-columns: 1fr; }
    #objective { min-width: 240px; }
    #minimap-wrap { width: 154px; height: 154px; }
    #minimap { width: 154px; height: 154px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Port Meridian, an open world crime game in a dusk harbour city. WASD to move, E to take a car, mouse to look, click to fire."></canvas>

<div id="hud" aria-hidden="true">
  <div class="panel" id="hud-left">
    <div id="health-row">
      <span class="label">HP</span>
      <div id="health-bar"><div id="health-fill"></div></div>
      <span id="health-num">100</span>
    </div>
    <div id="cash-row">
      <span class="label">Cash</span>
      <span id="cash">$250</span>
    </div>
    <div id="stars"><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
  </div>

  <div id="objective" class="panel">
    <div id="obj-job">JOB 1 OF 4</div>
    <div id="obj-name">FIRST WHEELS</div>
    <div id="obj-step">Steal any car</div>
  </div>

  <div id="hud-right">
    <div id="clock" class="panel">
      <span id="clock-time">19:40</span>
      <span id="clock-phase">DUSK</span>
    </div>
    <div id="weapon" class="panel">
      <span id="weapon-name">PISTOL</span>
      <span id="weapon-ammo">12 / 48</span>
    </div>
  </div>

  <div id="minimap-wrap">
    <canvas id="minimap" width="230" height="230"></canvas>
    <div id="minimap-n">N</div>
  </div>

  <div id="speedo" class="panel">
    <span id="speedo-num">0</span>
    <span id="speedo-unit">KM/H</span>
    <span id="gear">P</span>
  </div>

  <div id="prompt">E — take the car</div>
  <div id="banner">
    <div id="banner-title">FIRST WHEELS — COMPLETE</div>
    <div id="banner-sub">$450</div>
  </div>
</div>

<div id="vignette"></div>

<div id="overlay">
  <div class="card" id="overlay-card"></div>
</div>

<p id="status" role="status" aria-live="polite"></p>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
